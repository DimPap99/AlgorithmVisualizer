{% extends "base.html" %}
{% block head %}
  {% if runtime == 'browser' %}<script type="module" src="{{ url_for('static', filename='Javascript/runtime-client.mjs') }}"></script>{% endif %}
  <script src="{{ url_for('static', filename='Javascript/visualizer.js') }}"></script>
  <script src="{{ url_for('static', filename='Javascript/Sorting.js') }}"></script>
  <script defer src="{{ url_for('static', filename='Javascript/algorithm-guide.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/sortingCSS.css') }}">
{% endblock %}
{% block header %}
<div class="control-panel">
  <div class="toolbar">
    <button type="button" onclick="Clear()">Clear</button>
    <button type="button" onclick="generateArray(1, 150, 50)">Generate array</button>
    <button type="button" class="primary" data-runtime-action onclick="sortArray()"{% if runtime == 'browser' %} disabled{% endif %}>Sort</button>
    <button type="button" onclick="stopAnimation(); setStatus('Stopped.');">Stop</button>
    <label for="algorithm">Algorithm</label>
    <select id="algorithm" onchange="stopAnimation(); setStatus('');">
      {% for name in algorithms %}<option value="{{ name }}">{{ name }}</option>{% endfor %}
    </select>
  </div>
</div>
{% endblock %}
{% block content %}
<div class="result-controls">
  {% include "speedSlider.html" %}
  <p id="status" role="status" aria-live="polite"></p>
</div>
<div class="array-wrapper"><div class="array-container" id="array" role="img" aria-label="Array values shown as vertical bars"></div></div>
{% include "algorithmGuide.html" %}
{% endblock %}
