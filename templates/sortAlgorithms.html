{% extends "base.html" %}

{% block head %}
    <script src="{{ url_for('static', filename='Javascript/visualizer.js') }}"></script>
    <script src="{{ url_for('static', filename='Javascript/Sorting.js') }}"></script>
    <link rel= "stylesheet" type= "text/css" href="{{ url_for('static', filename='styles/sortingCSS.css') }}">
{% endblock head %}

  {% block header %}

    <div align="center">
        <a href="/" class="btn btn-outline-warning" >Back to the Main Page</a></div>
    <div class="container " >
    <button type="button" class="btn btn-outline-warning" onclick="Clear()">Clear</button>
    <button type="button" class="btn btn-outline-warning" onclick="generateArray(1,150,50)">Generate Random Array</button>
    <button type="button" class="btn btn-outline-warning" onclick="sortArray()">Sort</button>

    </div>
  <div class="form-group" style="margin:0 auto;" >
    <select  class="custom-select" id="algorithm" style="background-color: rgba(8,13,30,0.76); color: #ffce11" required>
      {% for name in algorithms %}
      <option value="{{ name }}">{{ name }}</option>
      {% endfor %}
    </select>
  </div>

    {% endblock header %}
{% block content %}
  <div class="container" style="margin-top: 20px;">
        <div class="slidecontainer">
  <input type="range" min="1" max="150" value="135"  class="slider" id="myRange">
            <p>Animation Speed: <span id="demo"></span></p></div>
        <p id="status"></p></div>

<div class="array-container" id="array">

</div>
  {% endblock %}
