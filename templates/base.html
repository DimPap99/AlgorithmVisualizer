<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ algorithm }} Visualizer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/visualizer.css') }}">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    {% block head %}
    {% endblock head %}
</head>
<body>


    <div style="background-color: rgba(8,13,30,0.76);">
    <div class="container">

      <!-- Grid row-->
      <div class="row py-4 d-flex align-items-center">

        <!-- Grid column -->
        <div class="col-md-6 col-lg-5 text-center text-md-left mb-4 mb-md-0">
          <h6 class="mb-0" style="color: white" >{{ algorithm }} Visualizer </h6>

        </div>
          {% block header %}
            {% endblock header %}


      </div>
      <!-- Grid row-->

    </div>
  </div>
    {% block content %}
    {% endblock %}

<!-- Footer -->
<footer class="page-footer font-small blue pt-4"></footer>
<!-- Footer -->
</body>
</html>
