<!doctype html>
<html lang="en" data-runtime="{{ runtime | default('server') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141714">
  <title>{{ algorithm }} Visualizer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/visualizer.css') }}">
  <script src="{{ url_for('static', filename='vendor/jquery-3.7.1.min.js') }}"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="{{ url_for('mainPage') }}">AlgorithmVisualizer</a>
      <nav aria-label="Navigation">
        <a href="{{ url_for('pathFinding') }}"{% if algorithm == 'Path Finding' %} aria-current="page"{% endif %}>Pathfinding</a>
        <a href="{{ url_for('sortAlgorithms') }}"{% if algorithm == 'Sort Algorithms' %} aria-current="page"{% endif %}>Sorting</a>
        <a href="https://dimpap99.github.io/">Blog</a>
        <a href="https://github.com/DimPap99/AlgorithmVisualizer">Source</a>
      </nav>
    </header>
    <main id="main">
      <h1>{{ algorithm }} Visualizer</h1>
      {% if runtime == 'browser' and algorithm != 'Algorithm' %}
      <div class="runtime-banner">
        <span id="runtime-status" role="status" aria-live="polite">Loading Python…</span>
        <button id="runtime-retry" type="button" hidden>Retry</button>
      </div>
      {% endif %}
      <noscript><p>Enable JavaScript to use the visualizations.</p></noscript>
      {% block header %}{% endblock %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
